name: Harita Build ve Deploy
run-name: ${{ gitea.actor }} Harita Build ve Deploy 🚀
on: [push]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v3

      # -----------------------------------------------------------------
      # CI KISMI
      # -----------------------------------------------------------------
      - name: Docker Buildx Kurulumu
        uses: docker/setup-buildx-action@v3

      - name: Docker Login (Gitea Registry)
        uses: docker/login-action@v3
        with:
          registry: git.konstantiniyye.studio
          username: patron
          password: ${{ secrets.DOCKER_PASSWORD }}

      # PUSH ADIMI
      - name: Docker Build ve Push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: git.konstantiniyye.studio/admin/dogu:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------
      # CD KISMI
      # -----------------------------------------------------------------
      
      # Kubectl'i mimariye uygun otomatik kuran action
      - name: Kubectl Kurulumu
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Kubernetes'e Deploy Et ve Güncelle
        run: |
          # 1. Secret'taki olası boşlukları ve satır sonlarını (tr komutuyla) temizleyip decode et
          echo "${{ secrets.KUBE_CONFIG }}" | tr -d '\n' | tr -d ' ' | base64 -d > /tmp/kubeconfig.yaml
          chmod 600 /tmp/kubeconfig.yaml
          
          # Kontrol: Dosya oluştu mu ve içi dolu mu? (İçeriği yazdırmaz, sadece boyutu yazar)
          if [ ! -s /tmp/kubeconfig.yaml ]; then
            echo "HATA: Kubeconfig dosyası boş! Secret içeriği hatalı olabilir."
            exit 1
          fi

          # 2. Yeni imaj Digest'ini al
          NEW_IMAGE_DIGEST="git.konstantiniyye.studio/admin/dogu@${{ steps.docker_build.outputs.digest }}"
          echo "Deploying image: $NEW_IMAGE_DIGEST"

          # 3. İmajı set et (Rancher/K8s güncellemesi)
          kubectl set image deployment/dogu-haritasi web=${NEW_IMAGE_DIGEST} \
            --kubeconfig=/tmp/kubeconfig.yaml -n harita

          # 4. Rollout restart ile podları yenile
          kubectl rollout restart deployment/dogu-haritasi \
            --kubeconfig=/tmp/kubeconfig.yaml -n harita