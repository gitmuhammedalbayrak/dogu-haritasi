name: Harita Build ve Deploy
run-name: ${{ gitea.actor }} Harita Build ve Deploy 🚀
on:
  push:
    branches:
      - main

env:
  APP_VERSION: "1.2.0"
  REGISTRY: "git.konstantiniyye.studio"
  IMAGE_NAME: "git.konstantiniyye.studio/admin/dogu"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v3

      # -----------------------------------------------------------------
      # CI: DOCKER BUILDX & MULTI-ARCH (ARM64 & AMD64)
      # -----------------------------------------------------------------
      - name: QEMU Kurulumu (Multi-arch desteği için)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx Kurulumu
        uses: docker/setup-buildx-action@v3

      - name: Docker Login (Gitea Registry)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: patron
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Multi-Arch Build ve Push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
            ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------
      # CD: KUBERNETES DEPLOYMENT & ROLLOUT
      # -----------------------------------------------------------------
      - name: Akıllı Deploy ve Config Onarımı
        run: |
          set -euo pipefail
          
          # Geçici dosyaların temizlenmesi garantisi
          trap 'rm -f /tmp/raw_secret /tmp/kubeconfig.yaml' EXIT
          
          echo "==== 1. ADIM: KUBECTL HAZIRLIK ===="
          ARCH="amd64"
          if [ "$(uname -m)" = "aarch64" ]; then ARCH="arm64"; fi
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/${ARCH}/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          
          echo "==== 2. ADIM: KUBECONFIG YAPILANDIRMASI ===="
          echo "${{ secrets.KUBE_CONFIG }}" > /tmp/raw_secret
          
          if grep -q "apiVersion" /tmp/raw_secret; then
            echo "✅ TESPIT: Secret düz YAML formatında."
            cp /tmp/raw_secret /tmp/kubeconfig.yaml
          else
            echo "⚠️ TESPIT: Secret Base64 formatında. Decode ediliyor..."
            tr -d '\n\r ' < /tmp/raw_secret | base64 -d > /tmp/kubeconfig.yaml
          fi

          chmod 600 /tmp/kubeconfig.yaml
          
          if [ ! -s /tmp/kubeconfig.yaml ]; then
            echo "❌ HATA: Kubeconfig dosyası boş!"
            exit 1
          fi

          export KUBECONFIG=/tmp/kubeconfig.yaml

          echo "==== 3. ADIM: KÜME BAĞLANTI TESTİ ===="
          kubectl get nodes -o wide
          
          echo "==== 4. ADIM: MANIFEST UYGULAMA VE ROLLOUT ===="
          NEW_IMAGE_DIGEST="${{ env.IMAGE_NAME }}@${{ steps.docker_build.outputs.digest }}"
          echo "Hedef İmaj Digest: $NEW_IMAGE_DIGEST"

          # Güncel Kubernetes manifestini uygula
          kubectl apply -f deployment.yaml

          # Çalışan dağıtımı yeni digest ile güncelle
          kubectl set image deployment/dogu-haritasi web="${NEW_IMAGE_DIGEST}" -n harita
          
          # Sıfır kesinti durumunu doğrula
          kubectl rollout status deployment/dogu-haritasi -n harita --timeout=180s
          
          echo "🚀 Deploy Başarıyla Tamamlandı!"