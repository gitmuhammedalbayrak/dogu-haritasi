name: Harita Build ve Deploy
run-name: ${{ gitea.actor }} Harita Build ve Deploy 🚀
on: [push]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v3

      # -----------------------------------------------------------------
      # CI KISMI
      # -----------------------------------------------------------------
      - name: Docker Buildx Kurulumu
        uses: docker/setup-buildx-action@v3

      - name: Docker Login (Gitea Registry)
        uses: docker/login-action@v3
        with:
          registry: git.konstantiniyye.studio
          username: patron
          password: ${{ secrets.DOCKER_PASSWORD }}

      # PUSH ADIMI
      - name: Docker Build ve Push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: git.konstantiniyye.studio/admin/dogu:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------
      # CD KISMI (Final - Manuel Kurulum ve Otomatik Algılama)
      # -----------------------------------------------------------------
      
      - name: Deploy İşlemi (Debug Modu)
        run: |
          set -e # Hata olursa anında dur
          
          echo "==== 1. ADIM: KUBECTL KURULUMU ===="
          # İşletim sistemi mimarisini bul (amd64 veya arm64)
          ARCH="amd64"
          if [ "$(uname -m)" = "aarch64" ]; then ARCH="arm64"; fi
          echo "Mimari: $ARCH tespit edildi."
          
          # Kubectl indir ve kur
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/${ARCH}/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          
          echo "Kubectl versiyonu:"
          kubectl version --client

          echo "==== 2. ADIM: CONFIG DOSYASINI OLUŞTURMA ===="
          # Secret içeriğini geçici bir dosyaya al
          echo "${{ secrets.KUBE_CONFIG }}" > /tmp/secret_raw
          
          # Dosyanın Base64 mü yoksa Düz YAML mı olduğunu kontrol et
          if grep -q "apiVersion" /tmp/secret_raw; then
            echo "TESPIT: Secret düz YAML formatında. Olduğu gibi kullanılıyor."
            mv /tmp/secret_raw /tmp/kubeconfig.yaml
          else
            echo "TESPIT: Secret Base64 formatında (veya bilinmiyor). Decode ediliyor..."
            cat /tmp/secret_raw | base64 -d > /tmp/kubeconfig.yaml
          fi
          
          chmod 600 /tmp/kubeconfig.yaml
          
          echo "==== 3. ADIM: BAĞLANTI TESTİ ===="
          # Bağlantı testi (Hata verirse deployu durdurur)
          kubectl get nodes --kubeconfig=/tmp/kubeconfig.yaml
          
          echo "==== 4. ADIM: DEPLOY VE GÜNCELLEME ===="
          NEW_IMAGE_DIGEST="git.konstantiniyye.studio/admin/dogu@${{ steps.docker_build.outputs.digest }}"
          echo "Yeni İmaj: $NEW_IMAGE_DIGEST"

          # Deployment güncelle
          kubectl set image deployment/dogu-haritasi web=${NEW_IMAGE_DIGEST} \
            --kubeconfig=/tmp/kubeconfig.yaml -n harita

          # Restart
          kubectl rollout restart deployment/dogu-haritasi \
            --kubeconfig=/tmp/kubeconfig.yaml -n harita
            
          echo "✅ BAŞARILI!"