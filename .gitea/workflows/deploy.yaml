name: Harita Build ve Deploy
run-name: ${{ gitea.actor }} Harita Build ve Deploy 🚀
on: [push]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v3

      # -----------------------------------------------------------------
      # CI KISMI
      # -----------------------------------------------------------------
      - name: Docker Buildx Kurulumu
        uses: docker/setup-buildx-action@v3

      - name: Docker Login (Gitea Registry)
        uses: docker/login-action@v3
        with:
          registry: git.konstantiniyye.studio
          username: patron
          password: ${{ secrets.DOCKER_PASSWORD }}

      # PUSH ADIMI
      - name: Docker Build ve Push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: git.konstantiniyye.studio/admin/dogu:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------
      # CD KISMI (Final - Manuel Kurulum ve Otomatik Algılama)
      # -----------------------------------------------------------------
      
      - name: Akıllı Deploy ve Config Onarımı
        run: |
          set -e
          
          echo "==== 1. ADIM: KUBECTL HAZIRLIK ===="
          # Mimariye uygun kubectl indir
          ARCH="amd64"
          if [ "$(uname -m)" = "aarch64" ]; then ARCH="arm64"; fi
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/${ARCH}/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          
          echo "==== 2. ADIM: CONFIG DOSYASINI OLUŞTURMA ===="
          # Secret'ı ham haliyle kaydet
          echo "${{ secrets.KUBE_CONFIG }}" > /tmp/raw_secret
          
          # YÖNTEM A: Dosya zaten DÜZ YAML mı? (İçinde 'apiVersion' yazıyor mu?)
          if grep -q "apiVersion" /tmp/raw_secret; then
            echo "✅ TESPIT: Secret zaten düz YAML formatında. Doğrudan kullanılıyor."
            cp /tmp/raw_secret /tmp/kubeconfig.yaml
          
          # YÖNTEM B: Değilse, Base64 olduğunu varsay ve temizleyerek decode et
          else
            echo "⚠️ TESPIT: Secret kodlanmış görünüyor. Temizlenip Base64 çözülüyor..."
            # Tüm boşlukları ve satır sonlarını silip öyle decode et (En kritik nokta burası)
            tr -d '\n\r ' < /tmp/raw_secret | base64 -d > /tmp/kubeconfig.yaml
          fi

          chmod 600 /tmp/kubeconfig.yaml
          
          # KONTROL: Dosya oluştu mu ve içeriği mantıklı mı?
          echo "Config dosyası kontrol ediliyor (İlk 5 satır):"
          head -n 5 /tmp/kubeconfig.yaml
          
          # Dosya boşsa hata ver
          if [ ! -s /tmp/kubeconfig.yaml ]; then
            echo "❌ HATA: Config dosyası boş oluşturuldu! Secret içeriğini kontrol et."
            exit 1
          fi

          echo "==== 3. ADIM: DEPLOY ===="
          NEW_IMAGE_DIGEST="git.konstantiniyye.studio/admin/dogu@${{ steps.docker_build.outputs.digest }}"
          echo "Hedef İmaj: $NEW_IMAGE_DIGEST"

          # --kubeconfig parametresi yerine env variable kullanalım (daha garantidir)
          export KUBECONFIG=/tmp/kubeconfig.yaml

          # Node'ları listele (Bağlantı testi)
          echo "Bağlantı Testi:"
          kubectl get nodes || { echo "❌ Sunucuya bağlanılamadı!"; exit 1; }

          # Güncelleme
          kubectl set image deployment/dogu-haritasi web=${NEW_IMAGE_DIGEST} -n harita
          kubectl rollout restart deployment/dogu-haritasi -n harita
          
          echo "🚀 Deploy Başarılı!"