apiVersion: apps/v1
kind: Deployment
metadata:
  name: dogu-haritasi
  namespace: harita
  labels:
    app.kubernetes.io/name: dogu-haritasi
    app.kubernetes.io/instance: dogu-haritasi
    app.kubernetes.io/version: "1.2.0"
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: dogu-haritasi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dogu-haritasi
        app.kubernetes.io/instance: dogu-haritasi
        app.kubernetes.io/version: "1.2.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      imagePullSecrets:
        - name: gitea-reg-cred
      containers:
        - name: web
          image: git.konstantiniyye.studio/admin/dogu:1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: var-cache-volume
              mountPath: /var/cache/nginx
            - name: var-log-volume
              mountPath: /var/log/nginx
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: var-cache-volume
          emptyDir: {}
        - name: var-log-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dogu-haritasi-service
  namespace: harita
  labels:
    app.kubernetes.io/name: dogu-haritasi
spec:
  selector:
    app.kubernetes.io/name: dogu-haritasi
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dogu-haritasi-ingress
  namespace: harita
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
spec:
  rules:
    - host: harita.konstantiniyye.studio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dogu-haritasi-service
                port:
                  number: 80