apiVersion: apps/v1
kind: Deployment
metadata:
  name: dogu-haritasi
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dogu-haritasi
  template:
    metadata:
      labels:
        app: dogu-haritasi
    spec:
      containers:
        - name: web
          # Kendi kullanıcı adınla güncelle
          image: git.konstantiniyye.studio/gitea_admin/dogu:latest 
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dogu-haritasi-service
  namespace: default
spec:
  selector:
    app: dogu-haritasi
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dogu-haritasi-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
    - host: harita.konstantiniyye.studio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dogu-haritasi-service
                port:
                  number: 80