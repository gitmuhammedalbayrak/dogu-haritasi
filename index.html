<!DOCTYPE html>
<html lang="tr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doğu Yönelimli İnteraktif Dünya Haritası | Modern Küresel Perspektif</title>
    
    <!-- D3.js ve TopoJSON -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    
    <!-- Modern Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root[data-theme="dark"] {
            --bg-ocean: #090d16;
            --land-fill: #131b2e;
            --land-stroke: #1e293b;
            --land-hover: #1e2d4a;
            --graticule-stroke: rgba(56, 189, 248, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-amber: #f59e0b;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(56, 189, 248, 0.2);
            --compass-bg: rgba(15, 23, 42, 0.9);
            --compass-border: #38bdf8;
            --route-maritime: #38bdf8;
            --route-silk: #f59e0b;
            --glow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        :root[data-theme="light"] {
            --bg-ocean: #e2e8f0;
            --land-fill: #ffffff;
            --land-stroke: #cbd5e1;
            --land-hover: #f1f5f9;
            --graticule-stroke: rgba(100, 116, 139, 0.15);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-cyan: #0284c7;
            --accent-amber: #d97706;
            --accent-emerald: #059669;
            --accent-rose: #e11d48;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(203, 213, 225, 0.8);
            --compass-bg: rgba(255, 255, 255, 0.95);
            --compass-border: #0284c7;
            --route-maritime: #0284c7;
            --route-silk: #d97706;
            --glow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        :root[data-theme="vintage"] {
            --bg-ocean: #d4e4e8;
            --land-fill: #e8dcc5;
            --land-stroke: #8b7355;
            --land-hover: #dfceb1;
            --graticule-stroke: rgba(139, 115, 85, 0.25);
            --text-main: #2c1810;
            --text-muted: #5d4037;
            --accent-cyan: #1d4e89;
            --accent-amber: #8b0000;
            --accent-emerald: #2d6a4f;
            --accent-rose: #8b0000;
            --card-bg: rgba(240, 230, 210, 0.92);
            --card-border: rgba(139, 115, 85, 0.4);
            --compass-bg: #fdfbf7;
            --compass-border: #8b7355;
            --route-maritime: #1d4e89;
            --route-silk: #8b0000;
            --glow: 0 4px 15px rgba(93, 64, 55, 0.15);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--bg-ocean);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        #map-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #map-wrapper:active {
            cursor: grabbing;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Map vector paths */
        .country {
            fill: var(--land-fill);
            stroke: var(--land-stroke);
            stroke-width: 0.5;
            transition: fill 0.2s ease, stroke 0.2s ease;
        }

        .country:hover {
            fill: var(--land-hover);
        }

        .graticule {
            fill: none;
            stroke: var(--graticule-stroke);
            stroke-width: 0.5;
            stroke-dasharray: 3, 3;
            pointer-events: none;
        }

        /* Trade Routes */
        .route-maritime {
            fill: none;
            stroke: var(--route-maritime);
            stroke-width: 1.5;
            stroke-dasharray: 4, 3;
            opacity: 0.85;
            animation: dashPulse 25s linear infinite;
        }

        .route-silk {
            fill: none;
            stroke: var(--route-silk);
            stroke-width: 1.8;
            stroke-dasharray: 6, 4;
            opacity: 0.85;
        }

        @keyframes dashPulse {
            to {
                stroke-dashoffset: -200;
            }
        }

        /* Markers */
        .city-marker {
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .city-marker:hover circle {
            stroke: #fff;
            stroke-width: 1.5;
            r: 5;
        }

        .chokepoint-marker {
            cursor: pointer;
        }

        .chokepoint-marker:hover circle {
            fill: var(--accent-rose);
            r: 6;
        }

        .city-label {
            font-size: 10px;
            font-weight: 600;
            fill: var(--text-main);
            pointer-events: none;
            paint-order: stroke fill;
            stroke: var(--bg-ocean);
            stroke-width: 2.5px;
            stroke-linejoin: round;
        }

        .chokepoint-label {
            font-size: 9px;
            font-weight: 700;
            fill: var(--accent-rose);
            pointer-events: none;
            paint-order: stroke fill;
            stroke: var(--bg-ocean);
            stroke-width: 2.5px;
            letter-spacing: 0.5px;
        }

        /* Glassmorphic UI Containers */
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: var(--glow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Header Brand & Top Bar */
        header {
            position: absolute;
            top: 16px;
            left: 20px;
            z-index: 100;
            pointer-events: auto;
            max-width: calc(100vw - 40px);
        }

        .header-content {
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-badge {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-amber));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            flex-shrink: 0;
        }

        .brand-text h1 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-text .sub {
            margin: 0;
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Search Bar */
        .search-container {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 320px;
            max-width: calc(100vw - 160px);
        }

        .search-box {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            gap: 10px;
        }

        .search-box i {
            color: var(--text-muted);
            font-size: 14px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.85rem;
            width: 100%;
            font-family: inherit;
        }

        .search-results {
            position: absolute;
            top: 48px;
            left: 0;
            right: 0;
            max-height: 240px;
            overflow-y: auto;
            display: none;
            padding: 6px;
            z-index: 101;
        }

        .search-item {
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s ease;
        }

        .search-item:hover {
            background: rgba(56, 189, 248, 0.15);
        }

        /* Orientation Selector & Compass Box */
        .orientation-dock {
            position: absolute;
            top: 16px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .orientation-pills {
            display: flex;
            padding: 4px;
            gap: 4px;
        }

        .pill-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-btn.active {
            background: var(--accent-cyan);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
        }

        /* Compass Visualizer */
        .compass-card {
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .compass-dial {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 2px solid var(--compass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .compass-needle {
            width: 4px;
            height: 38px;
            position: relative;
        }

        .needle-north {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 19px solid var(--accent-rose);
        }

        .needle-south {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 19px solid var(--text-muted);
        }

        .compass-letter {
            position: absolute;
            font-size: 8px;
            font-weight: 800;
            color: var(--text-main);
        }

        .letter-e { top: 2px; left: 50%; transform: translateX(-50%); color: var(--accent-rose); font-weight: 900; }
        .letter-w { bottom: 2px; left: 50%; transform: translateX(-50%); }
        .letter-n { left: 3px; top: 50%; transform: translateY(-50%); }
        .letter-s { right: 3px; top: 50%; transform: translateY(-50%); }

        /* Left Action / Layer Controls */
        .layers-drawer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .layer-title {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .layer-item {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
        }

        .layer-item input[type="checkbox"] {
            accent-color: var(--accent-cyan);
            cursor: pointer;
        }

        /* Bottom Controls (Zoom & Theme) */
        .bottom-right-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--glow);
            font-size: 15px;
            transition: transform 0.15s ease, background 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            background: var(--land-hover);
        }

        /* Detail Modal / Info Drawer */
        .info-card {
            position: absolute;
            bottom: 80px;
            right: 20px;
            z-index: 110;
            width: 320px;
            padding: 16px;
            display: none;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .info-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin: 0;
        }

        .info-tag {
            font-size: 0.68rem;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .info-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.45;
            margin: 8px 0 12px 0;
        }

        .info-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            border-top: 1px solid var(--card-border);
            padding-top: 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 0.82rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .search-container {
                display: none;
            }
            .layers-drawer {
                bottom: 74px;
                left: 12px;
                padding: 10px 12px;
            }
            .header-content {
                padding: 6px 12px;
            }
            .brand-text h1 {
                font-size: 0.85rem;
            }
            .orientation-pills .pill-btn {
                padding: 5px 8px;
                font-size: 0.68rem;
            }
            .info-card {
                left: 12px;
                right: 12px;
                width: auto;
                bottom: 80px;
            }
        }

        /* Loader */
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-ocean);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.6s ease;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <!-- Yükleniyor Ekranı -->
    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <div style="margin-top: 14px; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.5px;">Küresel Ağ Yükleniyor...</div>
    </div>

    <!-- Üst Başlık -->
    <header>
        <div class="glass-panel header-content">
            <div class="brand-badge">
                <i class="fa-solid fa-compass-drafting"></i>
            </div>
            <div class="brand-text">
                <h1>Doğu Yönelimli Dünya Haritası <span style="font-size: 0.7rem; padding: 2px 6px; border-radius: 6px; background: rgba(56, 189, 248, 0.2); color: var(--accent-cyan);">V1.2</span></h1>
                <p class="sub">Doğu-Yukarı & Küresel Ticaret Koridorları</p>
            </div>
        </div>
    </header>

    <!-- Arama Çubuğu -->
    <div class="search-container">
        <div class="glass-panel search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="Şehir, boğaz veya koridor ara..." autocomplete="off">
            <i class="fa-solid fa-xmark" id="search-clear" style="cursor: pointer; display: none;"></i>
        </div>
        <div class="glass-panel search-results" id="search-results"></div>
    </div>

    <!-- Yönelim ve Pusula Paneli -->
    <div class="orientation-dock">
        <div class="glass-panel orientation-pills">
            <button class="pill-btn active" data-angle="-90" title="Doğu Yukarı (Antik Orient)">Doğu (90°)</button>
            <button class="pill-btn" data-angle="0" title="Kuzey Yukarı (Modern Standart)">Kuzey (0°)</button>
            <button class="pill-btn" data-angle="180" title="Güney Yukarı (İslam Haritacılığı)">Güney (180°)</button>
            <button class="pill-btn" data-angle="90" title="Batı Yukarı">Batı (270°)</button>
        </div>

        <div class="glass-panel compass-card" id="compass-card" title="Tıkla: Yönü Sıfırla / Döndür">
            <div class="compass-dial" id="compass-dial">
                <span class="compass-letter letter-e">D</span>
                <span class="compass-letter letter-w">B</span>
                <span class="compass-letter letter-n">K</span>
                <span class="compass-letter letter-s">G</span>
                <div class="compass-needle">
                    <div class="needle-north"></div>
                    <div class="needle-south"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Harita Alanı -->
    <div id="map-wrapper">
        <svg id="map"></svg>
    </div>

    <!-- Katman Kontrolleri -->
    <div class="glass-panel layers-drawer">
        <div class="layer-title">Katman Filtreleri</div>
        <label class="layer-item">
            <input type="checkbox" id="layer-chokepoints" checked>
            <span>Stratejik Boğazlar & Kanallar</span>
        </label>
        <label class="layer-item">
            <input type="checkbox" id="layer-maritime" checked>
            <span>Modern Deniz Koridorları</span>
        </label>
        <label class="layer-item">
            <input type="checkbox" id="layer-silk" checked>
            <span>Tarihi İpek Yolu Ağı</span>
        </label>
        <label class="layer-item">
            <input type="checkbox" id="layer-cities" checked>
            <span>Küresel Finans & Mega Şehirler</span>
        </label>
        <label class="layer-item">
            <input type="checkbox" id="layer-graticule" checked>
            <span>Enlem / Boylam Ağı</span>
        </label>
    </div>

    <!-- Alt Sağ Kontroller (Zoom & Tema) -->
    <div class="bottom-right-controls">
        <button class="action-btn" id="btn-theme" title="Temayı Değiştir (Karanlık / Açık / Parşömen)">
            <i class="fa-solid fa-moon"></i>
        </button>
        <button class="action-btn" id="btn-zoom-in" title="Yakınlaştır">
            <i class="fa-solid fa-plus"></i>
        </button>
        <button class="action-btn" id="btn-zoom-out" title="Uzaklaştır">
            <i class="fa-solid fa-minus"></i>
        </button>
        <button class="action-btn" id="btn-reset" title="Görünümü Sıfırla">
            <i class="fa-solid fa-arrows-rotate"></i>
        </button>
    </div>

    <!-- Detay Bilgi Kartı -->
    <div class="glass-panel info-card" id="info-card">
        <div class="info-header">
            <div>
                <h3 class="info-title" id="info-title">-</h3>
                <span class="info-tag" id="info-type">-</span>
            </div>
            <button style="background: none; border: none; color: var(--text-muted); cursor: pointer;" id="info-close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <p class="info-desc" id="info-desc">-</p>
        <div class="info-stats">
            <div class="stat-item">
                <span class="stat-label">Koordinatlar</span>
                <span class="stat-value" id="stat-coords">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Stratejik Rol</span>
                <span class="stat-value" id="stat-role">-</span>
            </div>
            <div class="stat-item" style="margin-top: 6px;">
                <span class="stat-label">Canlı Yerel Saat</span>
                <span class="stat-value" id="stat-time">-</span>
            </div>
            <div class="stat-item" style="margin-top: 6px;">
                <span class="stat-label">Trafik / Nüfus</span>
                <span class="stat-value" id="stat-metric">-</span>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // 1. VERİ TANIMLAMALARI (Stratejik Boğazlar, Şehirler, Rotalar)
        // =========================================================================
        const CHOKEPOINTS = [
            { id: "suez", name: "Süveyş Kanalı", coords: [32.34, 30.60], type: "Deniz Kanalı", desc: "Küresel deniz ticaretinin %12'sinin ve konteyner hacminin %30'unun geçtiği, Asya ile Avrupa arasındaki en kritik suyolu.", role: "Küresel Konteyner Ana Damarı", traffic: "~50 Gemi / Gün", tz: 2 },
            { id: "malacca", name: "Malakka Boğazı", coords: [101.35, 2.50], type: "Stratejik Boğaz", desc: "Doğu Asya ve Çin ekonomisini Orta Doğu petrolüne ve Avrupa pazarlarına bağlayan dünyanın en yoğun boğazı.", role: "Enerji & Ticaret Boğazı", traffic: "~90.000 Gemi / Yıl", tz: 8 },
            { id: "hormuz", name: "Hürmüz Boğazı", coords: [56.40, 26.56], type: "Enerji Koridoru", desc: "Dünya petrol tüketiminin beşte birinin (~21 milyon varil/gün) geçtiği en kritik jeopolitik enerji darboğazı.", role: "Global Petrol Kilidi", traffic: "~21M Varil / Gün", tz: 4 },
            { id: "mandeb", name: "Babülmendep Boğazı", coords: [43.33, 12.58], type: "Stratejik Boğaz", desc: "Kızıldeniz'in Aden Körfezi çıkış kapısı. Süveyş Kanalı rotasının ayrılmaz ve hassas güvenlik noktası.", role: "Kızıldeniz Girişi", traffic: "Kritik Yük Hattı", tz: 3 },
            { id: "panama", name: "Panama Kanalı", coords: [-79.91, 9.10], type: "Kanal", desc: "Atlantik ile Pasifik Okyanusunu bağlayarak gemilerin Güney Amerika'yı dolaşmasını engelleyen mühendislik harikası.", role: "Trans-Okyanus Geçişi", traffic: "~14.000 Gemi / Yıl", tz: -5 },
            { id: "straits", name: "İstanbul & Çanakkale Boğazları", coords: [29.04, 41.12], type: "Doğal Boğazlar", desc: "Karadeniz havzasını Akdeniz ve dünya ticaretine bağlayan; tahıl, petrol ve emtia naklinin kalbi.", role: "Karadeniz Anahtarı", traffic: "~40.000 Gemi / Yıl", tz: 3 },
            { id: "gibraltar", name: "Cebelitarık Boğazı", coords: [-5.60, 35.98], type: "Doğal Boğaz", desc: "Akdeniz'i Atlantik Okyanusu'na bağlayan, antik çağlardan beri kontrolü elinde tutan güçlere stratejik üstünlük sağlayan boğaz.", role: "Akdeniz Atlantik Kapısı", traffic: "~100.000 Gemi / Yıl", tz: 1 }
        ];

        const GLOBAL_HUBS = [
            { name: "İstanbul", coords: [28.98, 41.01], role: "Avrasya Finans & Lojistik", metric: "15.9M Nüfus", tz: 3, desc: "İki kıtayı birleştiren, tarihi İpek Yolu'nun bitişi ve modern hava/deniz koridorlarının merkez üssü." },
            { name: "Tokyo", coords: [139.69, 35.69], role: "Mega Finans & Teknoloji", metric: "37.4M Nüfus", tz: 9, desc: "Dünyanın en büyük metropol ekonomisi, Asya-Pasifik ticaretinin en köklü başkenti." },
            { name: "Şanghay", coords: [121.47, 31.23], role: "Dünyanın En Büyük Limanı", metric: "29.8M Nüfus", tz: 8, desc: "Konteyner hacminde dünya birincisi, Çin imalat sanayisinin küresel açılış kapısı." },
            { name: "Singapur", coords: [103.82, 1.35], role: "Global Aktarma & Finans", metric: "5.9M Nüfus", tz: 8, desc: "Malakka Boğazı üzerinde dünya deniz ticaretinin ve serbest pazarın kilit noktası." },
            { name: "Dubai", coords: [55.27, 25.20], role: "Orta Doğu Lojistik Merkezi", metric: "3.6M Nüfus", tz: 4, desc: "Havacılık, serbest bölgeler ve küresel transit ticaretin modern vahası." },
            { name: "Londra", coords: [-0.13, 51.51], role: "Küresel Finans Sermayesi", metric: "9.6M Nüfus", tz: 0, desc: "Greenwich meridyeninin kalbi, uluslararası sigorta, denizcilik ve döviz piyasalarının merkezi." },
            { name: "New York", coords: [-74.01, 40.71], role: "Dünya Sermaye Piyasaları", metric: "19.5M Nüfus", tz: -5, desc: "Wall Street ve küresel sermaye akışının yönlendirildiği dev finans merkezi." },
            { name: "Frankfurt", coords: [8.68, 50.11], role: "Avrupa Merkez Bankası Üssü", metric: "2.3M Nüfus", tz: 1, desc: "Euro Bölgesi para politikasının ve kıta Avrupası transit demiryolu/hava ağının kalbi." },
            { name: "Pekin", coords: [116.41, 39.90], role: "Siyasi & Yatırım Merkezi", metric: "21.5M Nüfus", tz: 8, desc: "Kuşak ve Yol Girişimi'nin (BRI) stratejik ve finansal karar merkezi." }
        ];

        // Modern Deniz Koridorları (Koordinat dizileri)
        const MARITIME_ROUTES = [
            // Asya - Avrupa Ana Hattı (Şanghay -> Malakka -> Babülmendep -> Süveyş -> Cebelitarık -> Rotterdam)
            [[121.47, 31.23], [115.0, 15.0], [101.35, 2.50], [80.0, 6.0], [60.0, 12.0], [43.33, 12.58], [32.34, 30.60], [20.0, 36.0], [-5.60, 35.98], [-9.0, 42.0], [4.4, 51.9]],
            // Trans-Pasifik Hattı (Şanghay/Tokyo -> Los Angeles)
            [[121.47, 31.23], [139.69, 35.69], [170.0, 38.0], [-160.0, 38.0], [-118.24, 34.05]],
            // Hürmüz Petrol Hattı (Hürmüz -> Doğu Asya)
            [[56.40, 26.56], [65.0, 20.0], [80.0, 6.0], [101.35, 2.50]],
            // Trans-Atlantik Hattı (Rotterdam -> New York)
            [[4.4, 51.9], [-10.0, 50.0], [-40.0, 45.0], [-74.01, 40.71]],
            // Panama Koridoru (New York -> Panama -> Şanghay)
            [[-74.01, 40.71], [-75.0, 25.0], [-79.91, 9.10], [-110.0, 10.0], [-150.0, 15.0], [140.0, 20.0], [121.47, 31.23]]
        ];

        // Tarihi İpek Yolu (Kara Ağı)
        const SILK_ROAD_ROUTES = [
            [[108.94, 34.26], [94.66, 40.14], [75.98, 39.46], [66.97, 39.65], [62.19, 37.60], [51.42, 35.68], [46.29, 38.08], [28.98, 41.01], [12.33, 45.44]],
            [[66.97, 39.65], [60.63, 41.56], [50.0, 45.0], [39.7, 47.2], [28.98, 41.01]]
        ];

        // =========================================================================
        // 2. D3 & SVG KURULUMU
        // =========================================================================
        const mapContainer = document.getElementById('map-wrapper');
        let width = mapContainer.clientWidth;
        let height = mapContainer.clientHeight;
        let currentAngle = -90; // Varsayılan: Doğu-Yukarı

        const svg = d3.select("#map")
            .attr("width", "100%")
            .attr("height", "100%")
            .attr("viewBox", [0, 0, width, height]);

        // Arka Plan Deniz Alanı
        svg.append("rect")
            .attr("width", "100%")
            .attr("height", "100%")
            .attr("fill", "transparent");

        // Ana Taşıyıcı Grup (Zoom & Pan için)
        const mainGroup = svg.append("g").attr("id", "main-group");

        // Döndürülebilir Katman Grubu (Dinamik Yönelim için)
        const rotatableGroup = mainGroup.append("g")
            .attr("id", "rotatable-group")
            .attr("transform", `rotate(${currentAngle}, ${width / 2}, ${height / 2})`);

        // Alt Katman Grupları
        const graticuleGroup = rotatableGroup.append("g").attr("class", "layer-graticule");
        const countriesGroup = rotatableGroup.append("g").attr("class", "layer-countries");
        const routesGroup = rotatableGroup.append("g").attr("class", "layer-routes");
        const markersGroup = rotatableGroup.append("g").attr("class", "layer-markers");

        // Projeksiyon (Natural Earth)
        const projection = d3.geoNaturalEarth1()
            .scale(width / 5.2)
            .center([0, 0])
            .translate([width / 2, height / 2]);

        const pathGenerator = d3.geoPath().projection(projection);

        // Zoom & Pan Davranışı
        const zoomBehavior = d3.zoom()
            .scaleExtent([0.9, 12])
            .on("zoom", (event) => {
                mainGroup.attr("transform", event.transform);
                const k = event.transform.k;
                
                // Ölçek değiştikçe çizgi kalınlıklarını ve metin boyutlarını orantıla
                countriesGroup.selectAll(".country").attr("stroke-width", 0.5 / k);
                routesGroup.selectAll("path").attr("stroke-width", d => (d.silk ? 1.8 : 1.5) / k);
                markersGroup.selectAll(".city-marker circle").attr("r", 3.5 / k);
                markersGroup.selectAll(".chokepoint-marker circle").attr("r", 4.5 / k);
                markersGroup.selectAll(".city-label").style("font-size", `${10 / Math.pow(k, 0.4)}px`);
                markersGroup.selectAll(".chokepoint-label").style("font-size", `${9 / Math.pow(k, 0.4)}px`);
            });

        svg.call(zoomBehavior);
        svg.on("dblclick.zoom", null); // Çift tıklama zoom'unu engelle

        // =========================================================================
        // 3. VERİLERİ HARİTAYA ÇİZME
        // =========================================================================
        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {
            // Yükleme ekranını kaldır
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 600);

            const countries = topojson.feature(world, world.objects.countries);
            const graticule = d3.geoGraticule();

            // 1. Graticule
            graticuleGroup.append("path")
                .datum(graticule)
                .attr("class", "graticule")
                .attr("d", pathGenerator);

            // 2. Ülkeler
            countriesGroup.selectAll(".country")
                .data(countries.features)
                .enter().append("path")
                .attr("class", "country")
                .attr("d", pathGenerator);

            // 3. Rotalar
            // Modern Deniz Koridorları
            MARITIME_ROUTES.forEach(coords => {
                const geoLine = { type: "LineString", coordinates: coords, silk: false };
                routesGroup.append("path")
                    .datum(geoLine)
                    .attr("class", "route-maritime")
                    .attr("d", pathGenerator);
            });

            // Tarihi İpek Yolu
            SILK_ROAD_ROUTES.forEach(coords => {
                const geoLine = { type: "LineString", coordinates: coords, silk: true };
                routesGroup.append("path")
                    .datum(geoLine)
                    .attr("class", "route-silk")
                    .attr("d", pathGenerator);
            });

            // 4. Stratejik Boğazlar (Chokepoints)
            CHOKEPOINTS.forEach(choke => {
                const pt = projection(choke.coords);
                if (!pt) return;

                const gChoke = markersGroup.append("g")
                    .attr("class", "chokepoint-marker")
                    .attr("transform", `translate(${pt[0]}, ${pt[1]})`)
                    .on("click", (e) => {
                        e.stopPropagation();
                        showDetailCard(choke, "Stratejik Boğaz / Kanal");
                    });

                // Dış puls halkası
                gChoke.append("circle")
                    .attr("r", 7)
                    .attr("fill", "rgba(244, 63, 94, 0.25)")
                    .attr("stroke", "var(--accent-rose)")
                    .attr("stroke-width", 0.8);

                // İç nokta
                gChoke.append("circle")
                    .attr("r", 4.5)
                    .attr("fill", "var(--accent-rose)");

                // Başlık
                gChoke.append("text")
                    .attr("class", "chokepoint-label")
                    .attr("x", 8)
                    .attr("y", 3)
                    // Harita açısına göre ters çevirme (yazıların dik kalması için)
                    .attr("transform", `rotate(${-currentAngle})`)
                    .text(choke.name);
            });

            // 5. Global Finans ve Mega Şehirler
            GLOBAL_HUBS.forEach(city => {
                const pt = projection(city.coords);
                if (!pt) return;

                const gCity = markersGroup.append("g")
                    .attr("class", "city-marker")
                    .attr("transform", `translate(${pt[0]}, ${pt[1]})`)
                    .on("click", (e) => {
                        e.stopPropagation();
                        showDetailCard(city, "Küresel Hub & Finans Merkezi");
                    });

                gCity.append("circle")
                    .attr("r", 3.5)
                    .attr("fill", "var(--accent-cyan)")
                    .attr("stroke", "#fff")
                    .attr("stroke-width", 0.8);

                gCity.append("text")
                    .attr("class", "city-label")
                    .attr("x", 6)
                    .attr("y", 3)
                    .attr("transform", `rotate(${-currentAngle})`)
                    .text(city.name);
            });
        });

        // =========================================================================
        // 4. DİNAMİK YÖNELİM (ORIENTATION ENGINE) & PUSULA
        // =========================================================================
        function setOrientation(angle) {
            currentAngle = angle;

            // Harita grubunu pürüzsüzce döndür
            rotatableGroup.transition()
                .duration(1000)
                .ease(d3.easeCubicOut)
                .attr("transform", `rotate(${currentAngle}, ${width / 2}, ${height / 2})`);

            // Şehir ve boğaz yazılarının okunaklı kalması için ters rotasyon uygula
            markersGroup.selectAll(".city-label, .chokepoint-label")
                .transition()
                .duration(1000)
                .ease(d3.easeCubicOut)
                .attr("transform", `rotate(${-currentAngle})`);

            // Pusula ibresini döndür (Haritadaki Kuzey'i işaret etmesi için)
            // Doğu yukarı (-90) iken Kuzey solda (-90deg), Kuzey yukarıda (0) iken Kuzey yukarıda (0deg)
            const compassAngle = angle;
            document.getElementById('compass-dial').style.transform = `rotate(${compassAngle}deg)`;

            // Buton aktiflik durumlarını güncelle
            document.querySelectorAll('.pill-btn').forEach(btn => {
                if (parseInt(btn.getAttribute('data-angle')) === angle) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Yön butonları olayları
        document.querySelectorAll('.pill-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const angle = parseInt(btn.getAttribute('data-angle'));
                setOrientation(angle);
            });
        });

        // Pusula kartına tıklandığında bir sonraki yöne dön
        document.getElementById('compass-card').addEventListener('click', () => {
            const angles = [-90, 0, 180, 90];
            let nextIndex = (angles.indexOf(currentAngle) + 1) % angles.length;
            setOrientation(angles[nextIndex]);
        });

        // =========================================================================
        // 5. DETAY BİLGİ KARTI & SAAT HESABI
        // =========================================================================
        const infoCard = document.getElementById('info-card');
        document.getElementById('info-close').addEventListener('click', () => {
            infoCard.style.display = 'none';
        });

        function showDetailCard(data, type) {
            document.getElementById('info-title').innerText = data.name;
            document.getElementById('info-type').innerText = type;
            document.getElementById('info-desc').innerText = data.desc;
            document.getElementById('stat-coords').innerText = `${data.coords[1].toFixed(2)}° N, ${data.coords[0].toFixed(2)}° E`;
            document.getElementById('stat-role').innerText = data.role;
            document.getElementById('stat-metric').innerText = data.traffic || data.metric || 'N/A';

            // Canlı yerel saat hesabı (UTC offset)
            if (data.tz !== undefined) {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                const localDate = new Date(utc + (3600000 * data.tz));
                document.getElementById('stat-time').innerText = localDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ` (UTC${data.tz >= 0 ? '+' : ''}${data.tz})`;
            } else {
                document.getElementById('stat-time').innerText = 'UTC Bilgisi Yok';
            }

            infoCard.style.display = 'block';
        }

        // =========================================================================
        // 6. ARAMA VE FLY-TO (ODAKLANMA)
        // =========================================================================
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const searchClear = document.getElementById('search-clear');

        const ALL_SEARCHABLE = [
            ...CHOKEPOINTS.map(c => ({ ...c, category: "Boğaz / Kanal" })),
            ...GLOBAL_HUBS.map(h => ({ ...h, category: "Finans Merkezi" }))
        ];

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            if (!query) {
                searchResults.style.display = 'none';
                searchClear.style.display = 'none';
                return;
            }

            searchClear.style.display = 'block';
            const matched = ALL_SEARCHABLE.filter(item => item.name.toLowerCase().includes(query));

            if (matched.length === 0) {
                searchResults.innerHTML = `<div style="padding: 8px; font-size: 0.8rem; color: var(--text-muted);">Eşleşen konum bulunamadı</div>`;
            } else {
                searchResults.innerHTML = matched.map(item => `
                    <div class="search-item" data-id="${item.name}">
                        <span><strong>${item.name}</strong></span>
                        <span style="font-size: 0.7rem; color: var(--accent-cyan);">${item.category}</span>
                    </div>
                `).join('');

                searchResults.querySelectorAll('.search-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const targetName = el.getAttribute('data-id');
                        const targetObj = ALL_SEARCHABLE.find(i => i.name === targetName);
                        if (targetObj) {
                            flyTo(targetObj.coords);
                            showDetailCard(targetObj, targetObj.category);
                            searchResults.style.display = 'none';
                            searchInput.value = targetObj.name;
                        }
                    });
                });
            }
            searchResults.style.display = 'block';
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchResults.style.display = 'none';
            searchClear.style.display = 'none';
        });

        function flyTo(coords) {
            const pt = projection(coords);
            if (!pt) return;

            // Hedef noktayı merkeze getirmek için transform hesabı
            const scale = 3.5;
            // Açı rotasyonunu hesaba kat
            const rad = currentAngle * Math.PI / 180;
            const cx = width / 2;
            const cy = height / 2;
            
            // Merkezden fark
            const dx = pt[0] - cx;
            const dy = pt[1] - cy;
            
            // Döndürülmüş koordinat
            const rotatedX = cx + (dx * Math.cos(rad) - dy * Math.sin(rad));
            const rotatedY = cy + (dx * Math.sin(rad) + dy * Math.cos(rad));

            const tx = width / 2 - scale * rotatedX;
            const ty = height / 2 - scale * rotatedY;

            svg.transition()
                .duration(1200)
                .ease(d3.easeCubicInOut)
                .call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
        }

        // =========================================================================
        // 7. KATMAN AÇ / KAPA (TOGGLES)
        // =========================================================================
        document.getElementById('layer-chokepoints').addEventListener('change', (e) => {
            markersGroup.selectAll('.chokepoint-marker').style('display', e.target.checked ? null : 'none');
        });

        document.getElementById('layer-maritime').addEventListener('change', (e) => {
            routesGroup.selectAll('.route-maritime').style('display', e.target.checked ? null : 'none');
        });

        document.getElementById('layer-silk').addEventListener('change', (e) => {
            routesGroup.selectAll('.route-silk').style('display', e.target.checked ? null : 'none');
        });

        document.getElementById('layer-cities').addEventListener('change', (e) => {
            markersGroup.selectAll('.city-marker').style('display', e.target.checked ? null : 'none');
        });

        document.getElementById('layer-graticule').addEventListener('change', (e) => {
            graticuleGroup.style('display', e.target.checked ? null : 'none');
        });

        // =========================================================================
        // 8. TEMA DEĞİŞTİRİCİ (MODERN DARK / LIGHT / VINTAGE)
        // =========================================================================
        const themes = ["dark", "light", "vintage"];
        let currentThemeIndex = 0;
        const btnTheme = document.getElementById('btn-theme');

        btnTheme.addEventListener('click', () => {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const newTheme = themes[currentThemeIndex];
            document.documentElement.setAttribute('data-theme', newTheme);
            
            const icons = {
                dark: '<i class="fa-solid fa-moon"></i>',
                light: '<i class="fa-solid fa-sun"></i>',
                vintage: '<i class="fa-solid fa-scroll"></i>'
            };
            btnTheme.innerHTML = icons[newTheme];
        });

        // =========================================================================
        // 9. ZOOM & SIFIRLAMA BUTONLARI
        // =========================================================================
        document.getElementById('btn-zoom-in').addEventListener('click', () => {
            svg.transition().duration(400).call(zoomBehavior.scaleBy, 1.4);
        });

        document.getElementById('btn-zoom-out').addEventListener('click', () => {
            svg.transition().duration(400).call(zoomBehavior.scaleBy, 0.7);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            svg.transition().duration(800).call(zoomBehavior.transform, d3.zoomIdentity);
            setOrientation(-90);
            infoCard.style.display = 'none';
        });

        // Pencere Boyut Değişikliği
        window.addEventListener('resize', () => {
            width = mapContainer.clientWidth;
            height = mapContainer.clientHeight;
            svg.attr("viewBox", [0, 0, width, height]);
            projection.translate([width / 2, height / 2]);
            rotatableGroup.attr("transform", `rotate(${currentAngle}, ${width / 2}, ${height / 2})`);
        });

    </script>
</body>

</html>
