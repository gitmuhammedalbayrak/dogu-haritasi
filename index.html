<!DOCTYPE html>
<html lang="tr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>East-Oriented World Map | Doğu Yönelimli Dünya Haritası</title>
    
    <!-- D3.js ve TopoJSON -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root[data-theme="dark"] {
            --bg-ocean: #090d16;
            --land-fill: #131b2e;
            --land-stroke: #1e293b;
            --land-hover: #1e2d4a;
            --graticule-stroke: rgba(56, 189, 248, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-amber: #f59e0b;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --card-bg: rgba(15, 23, 42, 0.88);
            --card-border: rgba(56, 189, 248, 0.22);
            --compass-bg: rgba(15, 23, 42, 0.9);
            --compass-border: #38bdf8;
            --route-maritime: #38bdf8;
            --route-silk: #f59e0b;
            --glow: 0 0 15px rgba(56, 189, 248, 0.35);
            --continent-color: rgba(248, 250, 252, 0.75);
            --ocean-color: rgba(56, 189, 248, 0.55);
        }

        :root[data-theme="light"] {
            --bg-ocean: #e2e8f0;
            --land-fill: #ffffff;
            --land-stroke: #cbd5e1;
            --land-hover: #f1f5f9;
            --graticule-stroke: rgba(100, 116, 139, 0.15);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-cyan: #0284c7;
            --accent-amber: #d97706;
            --accent-emerald: #059669;
            --accent-rose: #e11d48;
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-border: rgba(203, 213, 225, 0.8);
            --compass-bg: rgba(255, 255, 255, 0.95);
            --compass-border: #0284c7;
            --route-maritime: #0284c7;
            --route-silk: #d97706;
            --glow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --continent-color: rgba(15, 23, 42, 0.70);
            --ocean-color: rgba(2, 132, 199, 0.55);
        }

        :root[data-theme="vintage"] {
            --bg-ocean: #d4e4e8;
            --land-fill: #e8dcc5;
            --land-stroke: #8b7355;
            --land-hover: #dfceb1;
            --graticule-stroke: rgba(139, 115, 85, 0.25);
            --text-main: #2c1810;
            --text-muted: #5d4037;
            --accent-cyan: #1d4e89;
            --accent-amber: #8b0000;
            --accent-emerald: #2d6a4f;
            --accent-rose: #8b0000;
            --card-bg: rgba(240, 230, 210, 0.94);
            --card-border: rgba(139, 115, 85, 0.4);
            --compass-bg: #fdfbf7;
            --compass-border: #8b7355;
            --route-maritime: #1d4e89;
            --route-silk: #8b0000;
            --glow: 0 4px 15px rgba(93, 64, 55, 0.15);
            --continent-color: rgba(93, 64, 55, 0.80);
            --ocean-color: rgba(29, 78, 137, 0.60);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--bg-ocean);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        #map-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #map-wrapper:active {
            cursor: grabbing;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Map vector paths */
        .country {
            fill: var(--land-fill);
            stroke: var(--land-stroke);
            stroke-width: 0.5;
            transition: fill 0.2s ease, stroke 0.2s ease;
        }

        .country:hover {
            fill: var(--land-hover);
        }

        .graticule {
            fill: none;
            stroke: var(--graticule-stroke);
            stroke-width: 0.5;
            stroke-dasharray: 3, 3;
            pointer-events: none;
        }

        /* Continents & Oceans */
        .continent-label {
            font-family: 'Cinzel Decorative', 'Plus Jakarta Sans', serif;
            font-size: 15px;
            font-weight: 900;
            fill: var(--continent-color);
            letter-spacing: 5px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            text-transform: uppercase;
            paint-order: stroke fill;
            stroke: var(--land-fill);
            stroke-width: 2.5px;
            stroke-linejoin: round;
        }

        .ocean-label {
            font-family: 'Cinzel Decorative', 'Plus Jakarta Sans', serif;
            font-size: 13px;
            font-weight: 700;
            font-style: italic;
            fill: var(--ocean-color);
            letter-spacing: 6px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            text-transform: uppercase;
            paint-order: stroke fill;
            stroke: var(--bg-ocean);
            stroke-width: 2px;
            stroke-linejoin: round;
        }

        /* Trade Routes */
        .route-maritime {
            fill: none;
            stroke: var(--route-maritime);
            stroke-width: 1.5;
            stroke-dasharray: 4, 3;
            opacity: 0.85;
            animation: dashPulse 25s linear infinite;
        }

        .route-silk {
            fill: none;
            stroke: var(--route-silk);
            stroke-width: 1.8;
            stroke-dasharray: 6, 4;
            opacity: 0.85;
        }

        @keyframes dashPulse {
            to { stroke-dashoffset: -200; }
        }

        /* Markers */
        .city-marker {
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .city-marker:hover circle {
            stroke: #fff;
            stroke-width: 1.5;
            r: 5;
        }

        .chokepoint-marker {
            cursor: pointer;
        }

        .chokepoint-marker:hover circle {
            fill: var(--accent-rose);
            r: 6;
        }

        .city-label {
            font-size: 10px;
            font-weight: 600;
            fill: var(--text-main);
            pointer-events: none;
            paint-order: stroke fill;
            stroke: var(--bg-ocean);
            stroke-width: 2.5px;
            stroke-linejoin: round;
        }

        .chokepoint-label {
            font-size: 9px;
            font-weight: 700;
            fill: var(--accent-rose);
            pointer-events: none;
            paint-order: stroke fill;
            stroke: var(--bg-ocean);
            stroke-width: 2.5px;
            letter-spacing: 0.5px;
        }

        /* Glassmorphic UI Containers */
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: var(--glow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Header Brand & Top Bar */
        header {
            position: absolute;
            top: 16px;
            left: 20px;
            z-index: 100;
            pointer-events: auto;
            max-width: calc(100vw - 40px);
        }

        .header-content {
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-amber));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            flex-shrink: 0;
        }

        .brand-text h1 {
            margin: 0;
            font-size: 1.02rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-text .sub {
            margin: 0;
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Language Toggle in Header */
        .lang-switch {
            display: flex;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 8px;
            padding: 2px;
            margin-left: 8px;
            border: 1px solid var(--card-border);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--accent-cyan);
            color: #ffffff;
            box-shadow: 0 1px 4px rgba(56, 189, 248, 0.4);
        }

        /* Search Bar */
        .search-container {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 320px;
            max-width: calc(100vw - 160px);
        }

        .search-box {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            gap: 10px;
        }

        .search-box i {
            color: var(--text-muted);
            font-size: 14px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.85rem;
            width: 100%;
            font-family: inherit;
        }

        .search-results {
            position: absolute;
            top: 48px;
            left: 0;
            right: 0;
            max-height: 240px;
            overflow-y: auto;
            display: none;
            padding: 6px;
            z-index: 101;
        }

        .search-item {
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s ease;
        }

        .search-item:hover {
            background: rgba(56, 189, 248, 0.15);
        }

        /* Orientation Selector & Compass Box */
        .orientation-dock {
            position: absolute;
            top: 16px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .orientation-pills {
            display: flex;
            padding: 4px;
            gap: 4px;
        }

        .pill-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-btn.active {
            background: var(--accent-cyan);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
        }

        /* Compass Visualizer */
        .compass-card {
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .compass-dial {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 2px solid var(--compass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .compass-needle {
            width: 4px;
            height: 38px;
            position: relative;
        }

        .needle-north {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 19px solid var(--accent-rose);
        }

        .needle-south {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 19px solid var(--text-muted);
        }

        .compass-letter {
            position: absolute;
            font-size: 8px;
            font-weight: 800;
            color: var(--text-main);
        }

        .letter-e { top: 2px; left: 50%; transform: translateX(-50%); color: var(--accent-rose); font-weight: 900; }
        .letter-w { bottom: 2px; left: 50%; transform: translateX(-50%); }
        .letter-n { left: 3px; top: 50%; transform: translateY(-50%); }
        .letter-s { right: 3px; top: 50%; transform: translateY(-50%); }

        /* Left Action / Layer Controls */
        .layers-drawer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .layer-title {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .layer-item {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
        }

        .layer-item input[type="checkbox"] {
            accent-color: var(--accent-cyan);
            cursor: pointer;
        }

        /* Bottom Controls (Zoom & Theme) */
        .bottom-right-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--glow);
            font-size: 15px;
            transition: transform 0.15s ease, background 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            background: var(--land-hover);
        }

        /* Detail Modal / Info Drawer */
        .info-card {
            position: absolute;
            bottom: 80px;
            right: 20px;
            z-index: 110;
            width: 320px;
            padding: 16px;
            display: none;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .info-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin: 0;
        }

        .info-tag {
            font-size: 0.68rem;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .info-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.45;
            margin: 8px 0 12px 0;
        }

        .info-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            border-top: 1px solid var(--card-border);
            padding-top: 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 0.82rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .search-container {
                display: none;
            }
            .layers-drawer {
                bottom: 74px;
                left: 12px;
                padding: 10px 12px;
            }
            .header-content {
                padding: 6px 12px;
            }
            .brand-text h1 {
                font-size: 0.82rem;
            }
            .orientation-pills .pill-btn {
                padding: 5px 8px;
                font-size: 0.68rem;
            }
            .info-card {
                left: 12px;
                right: 12px;
                width: auto;
                bottom: 80px;
            }
        }

        /* Loader */
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-ocean);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.6s ease;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <!-- Yükleniyor Ekranı -->
    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <div id="loader-text" style="margin-top: 14px; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.5px;">Küresel Ağ Yükleniyor...</div>
    </div>

    <!-- Üst Başlık -->
    <header>
        <div class="glass-panel header-content">
            <div class="brand-badge">
                <i class="fa-solid fa-compass-drafting"></i>
            </div>
            <div class="brand-text">
                <h1 id="ui-title">Doğu Yönelimli Dünya Haritası <span style="font-size: 0.7rem; padding: 2px 6px; border-radius: 6px; background: rgba(56, 189, 248, 0.2); color: var(--accent-cyan);">V1.2</span></h1>
                <p class="sub" id="ui-sub">Doğu-Yukarı & Küresel Ticaret Koridorları</p>
            </div>
            <!-- Dil Değiştirici -->
            <div class="lang-switch">
                <button class="lang-btn active" id="lang-tr" onclick="switchLanguage('tr')">TR</button>
                <button class="lang-btn" id="lang-en" onclick="switchLanguage('en')">EN</button>
            </div>
        </div>
    </header>

    <!-- Arama Çubuğu -->
    <div class="search-container">
        <div class="glass-panel search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="Şehir, boğaz veya koridor ara..." autocomplete="off">
            <i class="fa-solid fa-xmark" id="search-clear" style="cursor: pointer; display: none;"></i>
        </div>
        <div class="glass-panel search-results" id="search-results"></div>
    </div>

    <!-- Yönelim ve Pusula Paneli -->
    <div class="orientation-dock">
        <div class="glass-panel orientation-pills">
            <button class="pill-btn active" data-angle="-90" id="btn-orient-east">Doğu (90°)</button>
            <button class="pill-btn" data-angle="0" id="btn-orient-north">Kuzey (0°)</button>
            <button class="pill-btn" data-angle="180" id="btn-orient-south">Güney (180°)</button>
            <button class="pill-btn" data-angle="90" id="btn-orient-west">Batı (270°)</button>
        </div>

        <div class="glass-panel compass-card" id="compass-card" title="Tıkla: Yönü Döndür / Click to Rotate">
            <div class="compass-dial" id="compass-dial">
                <span class="compass-letter letter-e" id="compass-letter-e">D</span>
                <span class="compass-letter letter-w" id="compass-letter-w">B</span>
                <span class="compass-letter letter-n" id="compass-letter-n">K</span>
                <span class="compass-letter letter-s" id="compass-letter-s">G</span>
                <div class="compass-needle">
                    <div class="needle-north"></div>
                    <div class="needle-south"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Harita Alanı -->
    <div id="map-wrapper">
        <svg id="map"></svg>
    </div>

    <!-- Katman Kontrolleri -->
    <div class="glass-panel layers-drawer">
        <div class="layer-title" id="ui-layer-title">Katman Filtreleri</div>
        <label class="layer-item">
            <input type="checkbox" id="layer-chokepoints" checked>
            <span id="ui-layer-chokepoints">Stratejik Boğazlar & Kanallar</span>
        </label>
        <label class="layer-item">
            <input type="checkbox" id="layer-maritime" checked>
            <span id="ui-layer-maritime">Modern Deniz Koridorları</span>
        </label>
        <label class="layer-item">
            <input type="checkbox" id="layer-silk" checked>
            <span id="ui-layer-silk">Tarihi İpek Yolu Ağı</span>
        </label>
        <label class="layer-item">
            <input type="checkbox" id="layer-cities" checked>
            <span id="ui-layer-cities">Küresel Finans & Mega Şehirler</span>
        </label>
        <label class="layer-item">
            <input type="checkbox" id="layer-geolabels" checked>
            <span id="ui-layer-geolabels">Kıta ve Okyanus İsimleri</span>
        </label>
        <label class="layer-item">
            <input type="checkbox" id="layer-graticule" checked>
            <span id="ui-layer-graticule">Enlem / Boylam Ağı</span>
        </label>
    </div>

    <!-- Alt Sağ Kontroller (Zoom & Tema) -->
    <div class="bottom-right-controls">
        <button class="action-btn" id="btn-theme" title="Temayı Değiştir (Karanlık / Açık / Parşömen)">
            <i class="fa-solid fa-moon"></i>
        </button>
        <button class="action-btn" id="btn-zoom-in" title="Yakınlaştır / Zoom in">
            <i class="fa-solid fa-plus"></i>
        </button>
        <button class="action-btn" id="btn-zoom-out" title="Uzaklaştır / Zoom out">
            <i class="fa-solid fa-minus"></i>
        </button>
        <button class="action-btn" id="btn-reset" title="Görünümü Sıfırla / Reset view">
            <i class="fa-solid fa-arrows-rotate"></i>
        </button>
    </div>

    <!-- Detay Bilgi Kartı -->
    <div class="glass-panel info-card" id="info-card">
        <div class="info-header">

        // =========================================================================
        // 3. D3 HARİTA VE SVG KURULUMU
        // =========================================================================
        const mapContainer = document.getElementById('map-wrapper');
        let width = mapContainer.clientWidth;
        let height = mapContainer.clientHeight;
        let currentAngle = -90; // Varsayılan: Doğu-Yukarı (East-Up)

        const svg = d3.select("#map")
            .attr("width", "100%")
            .attr("height", "100%")
            .attr("viewBox", [0, 0, width, height]);

        svg.append("rect")
            .attr("width", "100%")
            .attr("height", "100%")
            .attr("fill", "transparent");

        const mainGroup = svg.append("g").attr("id", "main-group");

        const rotatableGroup = mainGroup.append("g")
            .attr("id", "rotatable-group")
            .attr("transform", `rotate(${currentAngle}, ${width / 2}, ${height / 2})`);

        // Katmanlar
        const graticuleGroup = rotatableGroup.append("g").attr("class", "layer-graticule");
        const countriesGroup = rotatableGroup.append("g").attr("class", "layer-countries");
        const geolabelsGroup = rotatableGroup.append("g").attr("class", "layer-geolabels");
        const routesGroup = rotatableGroup.append("g").attr("class", "layer-routes");
        const markersGroup = rotatableGroup.append("g").attr("class", "layer-markers");

        const projection = d3.geoNaturalEarth1()
            .scale(width / 5.2)
            .center([0, 0])
            .translate([width / 2, height / 2]);

        const pathGenerator = d3.geoPath().projection(projection);

        const zoomBehavior = d3.zoom()
            .scaleExtent([0.9, 14])
            .on("zoom", (event) => {
                mainGroup.attr("transform", event.transform);
                const k = event.transform.k;
                
                countriesGroup.selectAll(".country").attr("stroke-width", 0.5 / k);
                routesGroup.selectAll("path").attr("stroke-width", d => (d.silk ? 1.8 : 1.5) / k);
                markersGroup.selectAll(".city-marker circle").attr("r", 3.5 / k);
                markersGroup.selectAll(".chokepoint-marker circle").attr("r", 4.5 / k);
                markersGroup.selectAll(".city-label").style("font-size", `${10 / Math.pow(k, 0.4)}px`);
                markersGroup.selectAll(".chokepoint-label").style("font-size", `${9 / Math.pow(k, 0.4)}px`);
                geolabelsGroup.selectAll(".continent-label").style("font-size", `${14 / Math.pow(k, 0.3)}px`);
                geolabelsGroup.selectAll(".ocean-label").style("font-size", `${13 / Math.pow(k, 0.3)}px`);
            });

        svg.call(zoomBehavior);
        svg.on("dblclick.zoom", null);

        // =========================================================================
        // 4. VERİ ÇİZİMİ VE ETİKETLEME
        // =========================================================================
        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 600);

            const countries = topojson.feature(world, world.objects.countries);
            const graticule = d3.geoGraticule();

            // 1. Graticule
            graticuleGroup.append("path")
                .datum(graticule)
                .attr("class", "graticule")
                .attr("d", pathGenerator);

            // 2. Ülkeler
            countriesGroup.selectAll(".country")
                .data(countries.features)
                .enter().append("path")
                .attr("class", "country")
                .attr("d", pathGenerator);

            // 3. Kıta ve Okyanus İsimleri (Görkemli, Okunaklı ve Dönebilen)
            OCEANS.forEach(ocean => {
                const pt = projection(ocean.coords);
                if (!pt) return;
                const gOcean = geolabelsGroup.append("g")
                    .attr("class", "ocean-item")
                    .attr("transform", `translate(${pt[0]}, ${pt[1]})`);

                gOcean.append("text")
                    .attr("class", "ocean-label")
                    .attr("transform", `rotate(${-currentAngle})`)
                    .attr("data-tr", ocean.name_tr)
                    .attr("data-en", ocean.name_en)
                    .text(currentLang === 'en' ? ocean.name_en : ocean.name_tr);
            });

            CONTINENTS.forEach(cont => {
                const pt = projection(cont.coords);
                if (!pt) return;
                const gCont = geolabelsGroup.append("g")
                    .attr("class", "continent-item")
                    .attr("transform", `translate(${pt[0]}, ${pt[1]})`);

                gCont.append("text")
                    .attr("class", "continent-label")
                    .attr("transform", `rotate(${-currentAngle})`)
                    .attr("data-tr", cont.name_tr)
                    .attr("data-en", cont.name_en)
                    .text(currentLang === 'en' ? cont.name_en : cont.name_tr);
            });

            // 4. Rotalar
            MARITIME_ROUTES.forEach(coords => {
                routesGroup.append("path")
                    .datum({ type: "LineString", coordinates: coords, silk: false })
                    .attr("class", "route-maritime")
                    .attr("d", pathGenerator);
            });

            SILK_ROAD_ROUTES.forEach(coords => {
                routesGroup.append("path")
                    .datum({ type: "LineString", coordinates: coords, silk: true })
                    .attr("class", "route-silk")
                    .attr("d", pathGenerator);
            });

            // 5. Stratejik Boğazlar
            CHOKEPOINTS.forEach(choke => {
                const pt = projection(choke.coords);
                if (!pt) return;

                const gChoke = markersGroup.append("g")
                    .attr("class", "chokepoint-marker")
                    .attr("transform", `translate(${pt[0]}, ${pt[1]})`)
                    .on("click", (e) => {
                        e.stopPropagation();
                        showDetailCard(choke, "chokepoint");
                    });

                gChoke.append("circle")
                    .attr("r", 7)
                    .attr("fill", "rgba(244, 63, 94, 0.25)")
                    .attr("stroke", "var(--accent-rose)")
                    .attr("stroke-width", 0.8);

                gChoke.append("circle")
                    .attr("r", 4.5)
                    .attr("fill", "var(--accent-rose)");

                gChoke.append("text")
                    .attr("class", "chokepoint-label")
                    .attr("x", 8)
                    .attr("y", 3)
                    .attr("transform", `rotate(${-currentAngle})`)
                    .attr("data-tr", choke.name_tr)
                    .attr("data-en", choke.name_en)
                    .text(currentLang === 'en' ? choke.name_en : choke.name_tr);
            });

            // 6. Küresel Finans Merkezleri
            GLOBAL_HUBS.forEach(city => {
                const pt = projection(city.coords);
                if (!pt) return;

                const gCity = markersGroup.append("g")
                    .attr("class", "city-marker")
                    .attr("transform", `translate(${pt[0]}, ${pt[1]})`)
                    .on("click", (e) => {
                        e.stopPropagation();
                        showDetailCard(city, "city");
                    });

                gCity.append("circle")
                    .attr("r", 3.5)
                    .attr("fill", "var(--accent-cyan)")
                    .attr("stroke", "#fff")
                    .attr("stroke-width", 0.8);

                gCity.append("text")
                    .attr("class", "city-label")
                    .attr("x", 6)
                    .attr("y", 3)
                    .attr("transform", `rotate(${-currentAngle})`)
                    .attr("data-tr", city.name_tr)
                    .attr("data-en", city.name_en)
                    .text(currentLang === 'en' ? city.name_en : city.name_tr);
            });

            // Başlangıç dilini uygula
            switchLanguage(currentLang);
        });

        function updateMapLabels() {
            const isEn = currentLang === 'en';
            d3.selectAll(".continent-label, .ocean-label, .chokepoint-label, .city-label").each(function() {
                const el = d3.select(this);
                const txt = isEn ? el.attr("data-en") : el.attr("data-tr");
                if (txt) el.text(txt);
            });
        }

        // =========================================================================
        // 5. DİNAMİK YÖNELİM VE PUSULA
        // =========================================================================
        function setOrientation(angle) {
            currentAngle = angle;

            rotatableGroup.transition()
                .duration(1000)
                .ease(d3.easeCubicOut)
                .attr("transform", `rotate(${currentAngle}, ${width / 2}, ${height / 2})`);

            // Şehir, boğaz, kıta ve okyanus yazılarının dik durması için ters açı
            markersGroup.selectAll(".city-label, .chokepoint-label")
                .transition()
                .duration(1000)
                .ease(d3.easeCubicOut)
                .attr("transform", `rotate(${-currentAngle})`);

            geolabelsGroup.selectAll(".continent-label, .ocean-label")
                .transition()
                .duration(1000)
                .ease(d3.easeCubicOut)
                .attr("transform", `rotate(${-currentAngle})`);

            document.getElementById('compass-dial').style.transform = `rotate(${angle}deg)`;

            document.querySelectorAll('.pill-btn').forEach(btn => {
                if (parseInt(btn.getAttribute('data-angle')) === angle) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        document.querySelectorAll('.pill-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const angle = parseInt(btn.getAttribute('data-angle'));
                setOrientation(angle);
            });
        });

        document.getElementById('compass-card').addEventListener('click', () => {
            const angles = [-90, 0, 180, 90];
            let nextIndex = (angles.indexOf(currentAngle) + 1) % angles.length;
            setOrientation(angles[nextIndex]);
        });

        // =========================================================================
        // 6. DETAY BİLGİ KARTI
        // =========================================================================
        const infoCard = document.getElementById('info-card');
        document.getElementById('info-close').addEventListener('click', () => {
            infoCard.style.display = 'none';
        });

        function showDetailCard(data, category) {
            const isEn = currentLang === 'en';
            const title = isEn ? data.name_en : data.name_tr;
            const desc = isEn ? data.desc_en : data.desc_tr;
            const role = isEn ? data.role_en : data.role_tr;
            const metric = isEn ? (data.traffic_en || data.metric_en) : (data.traffic_tr || data.metric_tr);
            const tag = category === 'chokepoint' 
                ? (isEn ? 'Strategic Chokepoint' : 'Stratejik Boğaz / Kanal')
                : (isEn ? 'Global Financial Hub' : 'Küresel Finans Merkezi');

            document.getElementById('info-title').innerText = title;
            document.getElementById('info-type').innerText = tag;
            document.getElementById('info-desc').innerText = desc;
            document.getElementById('stat-coords').innerText = `${data.coords[1].toFixed(2)}° N, ${data.coords[0].toFixed(2)}° E`;
            document.getElementById('stat-role').innerText = role;
            document.getElementById('stat-metric').innerText = metric || 'N/A';

            if (data.tz !== undefined) {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                const localDate = new Date(utc + (3600000 * data.tz));
                document.getElementById('stat-time').innerText = localDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ` (UTC${data.tz >= 0 ? '+' : ''}${data.tz})`;
            } else {
                document.getElementById('stat-time').innerText = 'UTC N/A';
            }

            infoCard.style.display = 'block';
        }

        // =========================================================================
        // 7. ARAMA VE FLY-TO
        // =========================================================================
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const searchClear = document.getElementById('search-clear');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            if (!query) {
                searchResults.style.display = 'none';
                searchClear.style.display = 'none';
                return;
            }

            searchClear.style.display = 'block';
            const isEn = currentLang === 'en';
            
            const allItems = [
                ...CHOKEPOINTS.map(c => ({ 
                    ...c, 
                    display_name: isEn ? c.name_en : c.name_tr,
                    category: isEn ? 'Chokepoint' : 'Boğaz / Kanal',
                    rawCategory: 'chokepoint'
                })),
                ...GLOBAL_HUBS.map(h => ({ 
                    ...h, 
                    display_name: isEn ? h.name_en : h.name_tr,
                    category: isEn ? 'Financial Hub' : 'Finans Merkezi',
                    rawCategory: 'city'
                }))
            ];

            const matched = allItems.filter(item => 
                (item.name_tr && item.name_tr.toLowerCase().includes(query)) ||
                (item.name_en && item.name_en.toLowerCase().includes(query))
            );

            if (matched.length === 0) {
                searchResults.innerHTML = `<div style="padding: 8px; font-size: 0.8rem; color: var(--text-muted);">${I18N[currentLang].noMatch}</div>`;
            } else {
                searchResults.innerHTML = matched.map(item => `
                    <div class="search-item" data-id="${item.display_name}">
                        <span><strong>${item.display_name}</strong></span>
                        <span style="font-size: 0.7rem; color: var(--accent-cyan);">${item.category}</span>
                    </div>
                `).join('');

                searchResults.querySelectorAll('.search-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const targetName = el.getAttribute('data-id');
                        const targetObj = allItems.find(i => i.display_name === targetName);
                        if (targetObj) {
                            flyTo(targetObj.coords);
                            showDetailCard(targetObj, targetObj.rawCategory);
                            searchResults.style.display = 'none';
                            searchInput.value = targetObj.display_name;
                        }
                    });
                });
            }
            searchResults.style.display = 'block';
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchResults.style.display = 'none';
            searchClear.style.display = 'none';
        });

        function flyTo(coords) {
            const pt = projection(coords);
            if (!pt) return;

            const scale = 3.5;
            const rad = currentAngle * Math.PI / 180;
            const cx = width / 2;
            const cy = height / 2;
            
            const dx = pt[0] - cx;
            const dy = pt[1] - cy;
            
            const rotatedX = cx + (dx * Math.cos(rad) - dy * Math.sin(rad));
            const rotatedY = cy + (dx * Math.sin(rad) + dy * Math.cos(rad));

            const tx = width / 2 - scale * rotatedX;
            const ty = height / 2 - scale * rotatedY;

            svg.transition()
                .duration(1200)
                .ease(d3.easeCubicInOut)
                .call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
        }

        // =========================================================================
        // 8. KATMAN FİLTRELERİ
        // =========================================================================
        document.getElementById('layer-chokepoints').addEventListener('change', (e) => {
            markersGroup.selectAll('.chokepoint-marker').style('display', e.target.checked ? null : 'none');
        });

        document.getElementById('layer-maritime').addEventListener('change', (e) => {
            routesGroup.selectAll('.route-maritime').style('display', e.target.checked ? null : 'none');
        });

        document.getElementById('layer-silk').addEventListener('change', (e) => {
            routesGroup.selectAll('.route-silk').style('display', e.target.checked ? null : 'none');
        });

        document.getElementById('layer-cities').addEventListener('change', (e) => {
            markersGroup.selectAll('.city-marker').style('display', e.target.checked ? null : 'none');
        });

        document.getElementById('layer-geolabels').addEventListener('change', (e) => {
            geolabelsGroup.style('display', e.target.checked ? null : 'none');
        });

        document.getElementById('layer-graticule').addEventListener('change', (e) => {
            graticuleGroup.style('display', e.target.checked ? null : 'none');
        });

        // =========================================================================
        // 9. TEMA DEĞİŞTİRİCİ (DARK / LIGHT / VINTAGE)
        // =========================================================================
        const themes = ["dark", "light", "vintage"];
        let currentThemeIndex = 0;
        const btnTheme = document.getElementById('btn-theme');

        btnTheme.addEventListener('click', () => {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const newTheme = themes[currentThemeIndex];
            document.documentElement.setAttribute('data-theme', newTheme);
            
            const icons = {
                dark: '<i class="fa-solid fa-moon"></i>',
                light: '<i class="fa-solid fa-sun"></i>',
                vintage: '<i class="fa-solid fa-scroll"></i>'
            };
            btnTheme.innerHTML = icons[newTheme];
        });

        // =========================================================================
        // 10. ZOOM & SIFIRLAMA BUTONLARI
        // =========================================================================
        document.getElementById('btn-zoom-in').addEventListener('click', () => {
            svg.transition().duration(400).call(zoomBehavior.scaleBy, 1.4);
        });

        document.getElementById('btn-zoom-out').addEventListener('click', () => {
            svg.transition().duration(400).call(zoomBehavior.scaleBy, 0.7);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            svg.transition().duration(800).call(zoomBehavior.transform, d3.zoomIdentity);
            setOrientation(-90);
            infoCard.style.display = 'none';
        });

        window.addEventListener('resize', () => {
            width = mapContainer.clientWidth;
            height = mapContainer.clientHeight;
            svg.attr("viewBox", [0, 0, width, height]);
            projection.translate([width / 2, height / 2]);
            rotatableGroup.attr("transform", `rotate(${currentAngle}, ${width / 2}, ${height / 2})`);
        });

    </script>
</body>

</html>
